name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build

  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: shAn-kor/banryeo-kkurumi
          path: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e:runtime:check
        env:
          BANRYEO_BACKEND_ROOT: ${{ github.workspace }}/backend
      - run: bash scripts/q3-runtime.test.sh
        env:
          BANRYEO_BACKEND_ROOT: ${{ github.workspace }}/backend

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: shAn-kor/banryeo-kkurumi
          path: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npm run e2e:live
        env:
          BANRYEO_BACKEND_ROOT: ${{ github.workspace }}/backend
